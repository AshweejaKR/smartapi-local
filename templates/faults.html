{% extends "base.html" %}
{% block title %}Faults - Local SmartAPI{% endblock %}
{% block content %}<h1>Fault simulation</h1>{% if active %}<p class="danger">Active: {{ active.mode }}</p>{% else %}<p class="muted">No active REST fault.</p>{% endif %}<form method="post" action="/admin/faults"><label>Mode <select name="mode"><option value="unavailable">REST unavailable (503)</option><option value="slow">Slow response</option><option value="timeout">Timeout (504)</option><option value="500">HTTP 500</option><option value="503">HTTP 503</option><option value="auth">Token/auth failure</option></select></label><label>Duration in seconds <input type="number" name="duration" min="0.01" step="0.01" value="5"></label><button type="submit">Start fault</button></form>{% if active %}<form method="post" action="/admin/faults/clear"><button type="submit">Clear now</button></form>{% endif %}{% endblock %}
