<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Local SmartAPI Admin{% endblock %}</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 1350px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid #ccc; padding-bottom: .8rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: .55rem; text-align: left; }
    th { background: #f4f4f4; }
    input { padding: .45rem; max-width: 28rem; width: 100%; box-sizing: border-box; }
    button, .button { padding: .45rem .7rem; cursor: pointer; }
    .inline { display: inline-flex; gap: .35rem; align-items: center; margin: .15rem; }
    .inline input { width: 9rem; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(12rem, 1fr)); gap: .5rem 1rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .message { background: #e8f5e9; border: 1px solid #81c784; padding: .7rem; }
    .errors { background: #ffebee; border: 1px solid #e57373; padding: .7rem 2rem; }
    .muted { color: #666; }
    .danger { color: #a00; }
    .table-scroll { overflow-x: auto; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); gap: 1rem; }
    .dashboard-grid section { min-width: 0; }
    h2 { font-size: 1.2rem; margin-bottom: .3rem; }
    h2 a { font-size: .85rem; font-weight: normal; }
    input[type="checkbox"] { width: auto; }
    label { display: block; margin: .8rem 0; }
  </style>
</head>
<body>
  <nav><strong>Local SmartAPI</strong><a href="/admin">Dashboard</a><a href="/admin/users">Users</a><a href="/admin/account">Accounts</a><a href="/admin/market">Market</a><a href="/admin/charges">Charges</a><a href="/admin/rate-limits">Rate limits</a><a href="/admin/faults">Faults</a><a href="/admin/monitor/orders">Orders</a><a href="/admin/monitor/open-orders">Open limits</a><a href="/admin/monitor/positions">Positions</a><a href="/admin/monitor/holdings">Holdings</a><a href="/admin/monitor/trades">Trades</a><a href="/admin/audit">Audit</a><a href="/admin/resets">Resets</a><a href="/health">Health</a></nav>
  {% if request.query_params.get('message') %}<p class="message">{{ request.query_params.get('message') }}</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
